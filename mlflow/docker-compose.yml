version: '3.8'

services:
  mlflow:
    build: .
    ports:
      - "5001:5000"
    environment:
      - MLFLOW_SERVER_FILE_STORE=/mlflow/artifacts
      - MLFLOW_SERVER_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    depends_on:
      - postgres

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
      - POSTGRES_DB=mlflow
    ports:
      - "5432:5432"

volumes:
  mlflow-data:
